<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Начало</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap"
    rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="background"></div>
    <div id="overlay"></div>

    <div id="weatherWidget">

        <span id="weatherIcon">
            ⛅
        </span>

        <span id="weatherText">
            Зареждане...
        </span>

    </div>
    <button id="settingsButton" aria-label="Настройки">
        <img
                src="assets/icons/settings.png"
                alt="Настройки">
    </button>

    <main id="home">

        <div id="searchContainer">

            <h1 id="browserTitle">
                Моят браузър
            </h1>

            <form id="searchForm">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="🔍︎ Търсене"
                    autocomplete="off">

                <button
                    type="button"
                    id="copilotButton">
                    <img
                            src="https://res.cdn.office.net/officehub/images/content/images/unauth-copilotcom/favicon-copilot-brand-refresh-23392c1f66.ico"
                            alt="Copilot">
                </button>

            </form>

        </div>

    </main>

    <aside id="settingsPanel">

        <h2>Настройки</h2>

        <div class="section">

            <div class="wallpaperActions">

                <label
                    class="uploadButton"
                    for="wallpaperInput">

                    ＋ Добави фон

                </label>

                <button
                       type="button"
                       id="resetWallpaperButton">

                       ✕

                </button>

            </div>

            <input
                type="file"
                id="wallpaperInput"
                accept="image/*">

        </div>

        <div class="section">

            <h3>Фонове</h3>

            <div id="wallpaperGallery">

            </div>

        </div>

    </aside>

    <script src="js/storage.js"></script>
    <script src="js/search.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/wallpapers.js"></script>
    <script src="js/parallax.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
